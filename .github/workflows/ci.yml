# Runs the same checks as the local validation gate on every push to main and every pull request.
# Order: cheapest checks first, the production build last.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# On a pull request, a newer push cancels the run that is still going.
# On main every commit gets a complete run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Type-check, lint, translations, tests, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci also runs "postinstall", which copies the MapLibre worker that map-worker.test.ts checks.
      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      # Unit tests with coverage: fails when the pure logic loses test coverage (thresholds in vitest.config.mts).
      - run: npm run test:coverage
      # No NEXT_PUBLIC_PLAYTEST_TOOLS here: CI builds exactly what production would build.
      # Needs internet: next/font downloads the Google fonts at build time. If only this step
      # fails with a font/network error, check Google Fonts availability before the code.
      - run: npm run build

      # Browser tests (Playwright, a 390 px Chromium phone) against the production build made above:
      # GPS walks, a full game, languages, layout in de/ru/es, privacy of storage and requests.
      # Needs internet for the map tiles (OpenFreeMap).
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
